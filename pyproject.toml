[project]
name = "social-api"
version = "0.1.0"
description = "Production-grade social media backend (modular monolith)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "You", email = "you@example.com" }]

dependencies = [
    # Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",
    "slowapi>=0.1.9",
    "anyio>=4.0.0",

    # Config & validation
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "email-validator>=2.2.0",

    # DB
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncmy>=0.2.9",
    "alembic>=1.14.0",

    # Cache / queue
    "redis>=5.2.0",
    "celery[redis]>=5.4.0",

    # Auth & crypto
    "pyjwt[crypto]>=2.10.0",
    "passlib[argon2]>=1.7.4",
    "argon2-cffi>=23.1.0",
    "cryptography>=43.0.0",

    # Observability
    "structlog>=24.4.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
    "opentelemetry-instrumentation-redis>=0.49b0",
    "opentelemetry-instrumentation-httpx>=0.49b0",
    "opentelemetry-exporter-otlp>=1.28.0",

    # Resilience
    "slowapi>=0.1.9",
    "pybreaker>=1.2.0",

    # External
    "httpx>=0.27.0",
    "aiosmtplib>=3.0.0",
    "filetype>=1.2.0",

    # Contract export
    "openpyxl>=3.1.5",


    # i18n
    "babel>=2.16.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "fakeredis>=2.26.0",
    "testcontainers[mysql]>=4.8.0",
    "aiosmtpd>=1.4.5",
    "locust>=2.32.0",
    "bandit>=1.7.10",
    "pip-audit>=2.7.3",
    "pre-commit>=4.0.0",
    "httpx>=0.27.0",
    "boto3>=1.35.0",
    "types-boto3>=1.35.0",


]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# ----------------------------------------------------------------------------
# Ruff
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC", "S",
    "PLR1704", "PLW2901", "RUF100", "RUF101", "PT", "TID", "ERA",
]
ignore = [
    # B008: FastAPI's `Depends(...)` MUST be in argument defaults — this is the
    # framework's dependency-injection pattern, not a Python pitfall.
    "B008",
    # S105: `Literal["Bearer"] = "Bearer"` is a token-type label, not a secret.
    # All real hardcoded-password rules remain active.
    "S105",
]


[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S106"]
"alembic/**" = ["N999"]
"scripts/**" = ["T201", "S101"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"

# ----------------------------------------------------------------------------
# Mypy strict
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
show_error_codes = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["social_api"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = [
    "magic",
    "aiosmtpd.*",
    "testcontainers.*",
    "passlib.*",
    "redis.*",
    "boto3.*",
    "botocore.*",
    "filetype",
]
ignore_missing_imports = true

# ----------------------------------------------------------------------------
# Pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "unit: fast unit tests",
    "integration: needs docker services",
    "e2e: end-to-end lifecycle",
    "slow: slow tests",
]

[tool.coverage.run]
source = ["src/social_api"]
branch = true
omit = [
    "*/__init__.py",
    # M0 stubs — exclude until the milestone that implements them:
    "src/social_api/db/*",                     # M3
    "src/social_api/cache/*",                  # M3
    "src/social_api/observability/tracing.py", # M21
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 60  # M0 target; raise to 85 by M2 (M2 checklist item)

[tool.bandit]
exclude_dirs = ["tests", "alembic", "venv", ".venv", "data", "contracts", "scripts"]
skips = ["B101", "B104", "B105"]
