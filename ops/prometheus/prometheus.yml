global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/*.yml

# Target resolution happens on the compose `backend` network, where service
# names are DNS entries. `host.docker.internal` only resolves when the scraper
# shares the host's network namespace — the API does not publish a host port in
# prod (`expose: 8000`), so scraping it that way collected nothing at all.
scrape_configs:
  - job_name: social-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # Host / volume capacity. Nothing emitted node_filesystem_* before this job
  # existed, so the DiskSpaceLow alert could never fire.
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]

  # Self-scrape: proves the scrape loop is alive and lets the "Prometheus is
  # down" style rules resolve.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
