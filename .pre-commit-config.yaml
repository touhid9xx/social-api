repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      # Generated artefacts (contracts, lockfiles) are rewritten by tooling and
      # must stay byte-identical to their generator output — never reflow them.
      - id: trailing-whitespace
        exclude: ^(contracts|frontend/contracts)/
      - id: end-of-file-fixer
        exclude: ^(contracts|frontend/contracts)/
      - id: check-yaml
        # pnpm-lock.yaml is a *multi-document* YAML stream; the hook only
        # accepts a single document.
        exclude: ^frontend/pnpm-lock\.yaml$
      - id: check-json
        # frontend/tsconfig.json is JSONC, not JSON: TypeScript officially
        # allows `//` comments there, and this file uses them to record why
        # `baseUrl` is omitted. Strict JSON parsing can never accept it.
        exclude: ^frontend/tsconfig\.json$
      - id: check-added-large-files
        args: ["--maxkb=2000"]

  # Keep this rev in sync with the `ruff` version installed in the project venv
  # (`ruff --version`). A mismatch makes the hook reformat files to an older
  # style, fighting the formatter the developer and CI actually use.
  #
  # `alembic/` is excluded on purpose: migrations are historical artefacts and
  # reformatting them produces diffs that look like schema edits. This mirrors
  # scripts/check_all.ps1, which scopes ruff to `src tests scripts`.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff
        args: ["--fix"]
        exclude: ^alembic/
      - id: ruff-format
        exclude: ^alembic/

  # Keep this rev in sync with the venv `mypy --version`.
  # `additional_dependencies` must cover the project's runtime imports, otherwise
  # mypy runs in an isolated env and reports `import-not-found` for every
  # third-party package. Keep roughly in sync with [project].dependencies.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.4.0
    hooks:
      - id: mypy
        additional_dependencies:
          - pydantic>=2.9.0
          - pydantic-settings>=2.6.0
          - fastapi>=0.115.0
          - sqlalchemy[asyncio]>=2.0.36
          - asyncmy>=0.2.9
          - alembic>=1.14.0
          - structlog>=24.4.0
          - httpx>=0.27.0
          - redis>=5.2.0
          - celery[redis]>=5.4.0
          - boto3>=1.35.0
          - types-boto3>=1.35.0
          - filetype>=1.2.0
          - passlib[argon2]>=1.7.4
          - python-magic>=0.4.27
          - opentelemetry-exporter-otlp>=1.28.0
          - opentelemetry-instrumentation-redis>=0.49b0
          - opentelemetry-instrumentation-httpx>=0.49b0
          - slowapi>=0.1.9
          - pybreaker>=1.2.0
          - email-validator>=2.2.0
          - pyjwt[crypto]>=2.10.0
          - argon2-cffi>=23.1.0
          - cryptography>=43.0.0
          - babel>=2.16.0
          - aiosmtplib>=3.0.0
          - prometheus-fastapi-instrumentator>=7.0.0
          - openpyxl>=3.1.5
          - types-openpyxl>=3.1
          - opentelemetry-api>=1.28.0
          - opentelemetry-sdk>=1.28.0
          - opentelemetry-instrumentation-fastapi>=0.49b0
          - opentelemetry-instrumentation-sqlalchemy>=0.49b0
        args: ["--config-file=pyproject.toml"]
        files: ^src/

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.10
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]
        exclude: ^tests/

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.20.1
    hooks:
      - id: gitleaks
