name: Nightly Integration Smoke

on:
  schedule:
    # Daily 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: e2e-nightly
  # Never cancel a running E2E — let it finish, even if a new one is scheduled.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  nightly-integration:
    name: Nightly integration (full API lifecycle)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: social
          MYSQL_USER: social
          MYSQL_PASSWORD: socialpass
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -usocial -psocialpass"
          --health-interval=10s --health-timeout=5s --health-retries=15
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node 20 (for contract export drift check)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Prepare secrets + env
        run: |
          mkdir -p secrets
          python - <<'PY'
          from cryptography.fernet import Fernet
          from cryptography.hazmat.primitives.asymmetric import rsa
          from cryptography.hazmat.primitives import serialization
          open("secrets/enc.key", "w").write(Fernet.generate_key().decode())
          k = rsa.generate_private_key(public_exponent=65537, key_size=2048)
          open("secrets/jwt_private.pem", "wb").write(k.private_bytes(
              serialization.Encoding.PEM,
              serialization.PrivateFormat.PKCS8,
              serialization.NoEncryption(),
          ))
          open("secrets/jwt_public.pem", "wb").write(k.public_key().public_bytes(
              serialization.Encoding.PEM,
              serialization.PublicFormat.SubjectPublicKeyInfo,
          ))
          PY

          # Normalize line endings (Windows-authored .env.example → LF)
          tr -d '\r' < .env.example > .env

          # The CI MySQL service exposes 127.0.0.1:3306 (not 3307 from .env.example)
          sed -i 's|MYSQL_PORT=.*|MYSQL_PORT=3306|' .env
          sed -i 's|DATABASE_URL=.*|DATABASE_URL=mysql+asyncmy://social:socialpass@127.0.0.1:3306/social?charset=utf8mb4|' .env
          sed -i 's|REDIS_URL=.*|REDIS_URL=redis://127.0.0.1:6379/0|' .env
          sed -i 's|CELERY_BROKER_URL=.*|CELERY_BROKER_URL=redis://127.0.0.1:6379/1|' .env
          sed -i 's|CELERY_RESULT_BACKEND=.*|CELERY_RESULT_BACKEND=redis://127.0.0.1:6379/2|' .env
          sed -i 's|CELERY_TASK_ALWAYS_EAGER=.*|CELERY_TASK_ALWAYS_EAGER=true|' .env

          # Sanity: prove the URL was rewritten (fails fast if sed pattern drifts)
          grep -q "DATABASE_URL=mysql+asyncmy://social:socialpass@127.0.0.1:3306/" .env \
            || (echo "::error::.env DATABASE_URL was not rewritten to port 3306" && exit 1)

      - name: Alembic upgrade head
        env:
          DATABASE_URL: mysql+asyncmy://social:socialpass@127.0.0.1:3306/social?charset=utf8mb4
        run: alembic upgrade head

      - name: Contract drift (catches stale contracts before running)
        run: python scripts/check_api_contract_drift.py

      - name: Run integration suite
        env:
          DATABASE_URL: mysql+asyncmy://social:socialpass@127.0.0.1:3306/social?charset=utf8mb4
        run: pytest tests/integration -v --maxfail=1

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: |
            .pytest_cache/
            seed.log
          retention-days: 7
          if-no-files-found: ignore
