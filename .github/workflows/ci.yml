name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: social
          MYSQL_USER: social
          MYSQL_PASSWORD: socialpass
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -usocial -psocialpass"
          --health-interval=10s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Generate test secrets
        run: |
          mkdir -p secrets
          python -c "from cryptography.fernet import Fernet; open('secrets/enc.key','w').write(Fernet.generate_key().decode())"
          python -c "from cryptography.hazmat.primitives.asymmetric import rsa; from cryptography.hazmat.primitives import serialization; k=rsa.generate_private_key(public_exponent=65537,key_size=2048); open('secrets/jwt_private.pem','wb').write(k.private_bytes(serialization.Encoding.PEM,serialization.PrivateFormat.PKCS8,serialization.NoEncryption())); open('secrets/jwt_public.pem','wb').write(k.public_key().public_bytes(serialization.Encoding.PEM,serialization.PublicFormat.SubjectPublicKeyInfo))"

      - name: Copy env
        run: cp .env.example .env

      - name: Ruff check
        run: ruff check src tests scripts

      - name: Ruff format check
        run: ruff format --check src tests scripts

      - name: Mypy
        run: mypy src

      - name: Bandit
        run: bandit -r src -c pyproject.toml

      - name: Pytest (coverage gate 85%)
        run: |
          pytest tests/unit \
            --cov=src/social_api \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=85

      - name: Contract drift check
        run: |
          python scripts/export_api_contract.py
          git diff --exit-code contracts/ || (echo "Contracts out of date — run export_api_contract.py locally and commit." && exit 1)

      - name: Alembic round-trip
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
