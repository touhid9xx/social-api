name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: Lint + types + security + tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: social
          MYSQL_USER: social
          MYSQL_PASSWORD: socialpass
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -usocial -psocialpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Set up Node (for json-schema-to-typescript)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install project (editable + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Prepare test secrets + env
        run: |
          mkdir -p secrets
          python - <<'PY'
          from cryptography.fernet import Fernet
          from cryptography.hazmat.primitives.asymmetric import rsa
          from cryptography.hazmat.primitives import serialization
          open("secrets/enc.key", "w").write(Fernet.generate_key().decode())
          k = rsa.generate_private_key(public_exponent=65537, key_size=2048)
          open("secrets/jwt_private.pem", "wb").write(k.private_bytes(
              serialization.Encoding.PEM,
              serialization.PrivateFormat.PKCS8,
              serialization.NoEncryption(),
          ))
          open("secrets/jwt_public.pem", "wb").write(k.public_key().public_bytes(
              serialization.Encoding.PEM,
              serialization.PublicFormat.SubjectPublicKeyInfo,
          ))
          PY
          cp .env.example .env

      - name: ruff format --check
        run: ruff format --check src tests scripts

      - name: ruff check
        run: ruff check src tests scripts

      - name: mypy (strict)
        run: mypy src tests

      - name: bandit
        run: bandit -r src -c pyproject.toml -q

      - name: pytest with 85% coverage gate
        run: |
          pytest tests/unit \
            --cov=src/social_api \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=85

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

      - name: Regenerate contracts (in CI, to prove determinism)
        run: python scripts/export_api_contract.py

      - name: Contract drift check
        run: python scripts/check_api_contract_drift.py

      - name: Fail if contracts folder changed after regeneration
        run: |
          if ! git diff --quiet -- contracts/; then
            echo "::error::contracts/ is stale. Run 'python scripts/export_api_contract.py' locally and commit."
            git diff -- contracts/ || true
            exit 1
          fi

      - name: Alembic round-trip (upgrade -> downgrade -> upgrade)
        env:
          DATABASE_URL: mysql+asyncmy://social:socialpass@127.0.0.1:3306/social?charset=utf8mb4
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  pre-commit-all:
    name: pre-commit run --all-files
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Prepare env
        run: cp .env.example .env

      - name: Cache pre-commit
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: precommit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure
