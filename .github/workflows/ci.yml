name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: Lint + types + security + tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: social
          MYSQL_USER: social
          MYSQL_PASSWORD: socialpass
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -usocial -psocialpass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Set up Node (for json-schema-to-typescript)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install project (editable + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Prepare test secrets + env
        run: |
          mkdir -p secrets
          python - <<'PY'
          from cryptography.fernet import Fernet
          from cryptography.hazmat.primitives.asymmetric import rsa
          from cryptography.hazmat.primitives import serialization
          open("secrets/enc.key", "w").write(Fernet.generate_key().decode())
          k = rsa.generate_private_key(public_exponent=65537, key_size=2048)
          open("secrets/jwt_private.pem", "wb").write(k.private_bytes(
              serialization.Encoding.PEM,
              serialization.PrivateFormat.PKCS8,
              serialization.NoEncryption(),
          ))
          open("secrets/jwt_public.pem", "wb").write(k.public_key().public_bytes(
              serialization.Encoding.PEM,
              serialization.PublicFormat.SubjectPublicKeyInfo,
          ))
          PY
          cp .env.example .env

      - name: ruff format --check
        run: ruff format --check src tests scripts

      - name: ruff check
        run: ruff check src tests scripts

      - name: mypy (strict)
        run: mypy src tests

      - name: bandit
        run: bandit -r src -c pyproject.toml -q

      # The coverage floor lives in pyproject.toml ([tool.coverage.report]) so
      # there is exactly one number to keep honest.
      - name: pytest with coverage gate
        run: |
          pytest tests/unit \
            --cov=src/social_api \
            --cov-report=term-missing \
            --cov-report=xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

      - name: Regenerate contracts (in CI, to prove determinism)
        run: python scripts/export_api_contract.py

      - name: Contract drift check
        run: python scripts/check_api_contract_drift.py

      - name: Fail if contracts folder changed after regeneration
        run: |
          if ! git diff --quiet -- contracts/; then
            echo "::error::contracts/ is stale. Run 'python scripts/export_api_contract.py' locally and commit."
            git diff -- contracts/ || true
            exit 1
          fi

      - name: Alembic round-trip (upgrade -> downgrade -> upgrade)
        env:
          DATABASE_URL: mysql+asyncmy://social:socialpass@127.0.0.1:3306/social?charset=utf8mb4
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  pre-commit-all:
    name: pre-commit run --all-files
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Prepare env
        run: cp .env.example .env

      - name: Cache pre-commit
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: precommit-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure

  docker-build:
    name: Docker build (production image)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Runs after quality succeeds so we don't waste CI time building an
    # image whose tests would fail.
    needs: [quality]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Cache layers between CI runs via GHA cache. Without this, a
      # `--no-cache` rebuild burns ~5-8 minutes per run because
      # `pip install -e .` re-resolves the whole dependency tree.
      - name: Build image (with layer caching)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          tags: social-api:test
          load: true
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Verify image — app imports cleanly
        env:
          # Minimal env so get_settings() doesn't crash during import.
          # NO real secrets — this only proves the module loads.
          ENCRYPTION_KEY: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          JWT_PRIVATE_KEY_PATH: /app/secrets/jwt_private.pem
          JWT_PUBLIC_KEY_PATH: /app/secrets/jwt_public.pem
          SECRETS_BACKEND: skip
          DATABASE_URL: mysql+asyncmy://x:x@127.0.0.1:3306/x
        run: |
          docker run --rm \
            -e ENCRYPTION_KEY="$ENCRYPTION_KEY" \
            -e JWT_PRIVATE_KEY_PATH="$JWT_PRIVATE_KEY_PATH" \
            -e JWT_PUBLIC_KEY_PATH="$JWT_PUBLIC_KEY_PATH" \
            -e SECRETS_BACKEND="$SECRETS_BACKEND" \
            -e DATABASE_URL="$DATABASE_URL" \
            social-api:test \
            python -c "import social_api.main; print('import ok')"

      - name: Verify image — CLIs are on PATH
        run: |
          docker run --rm social-api:test sh -c "
            set -e
            for bin in gunicorn celery alembic; do
              command -v \$bin >/dev/null || (echo \"missing \$bin\" && exit 1)
              echo \"\$bin: \$(command -v \$bin)\"
            done
          "

      - name: Verify image — entrypoint supports all roles
        run: |
          docker run --rm social-api:test sh -c 'echo "shell role test"; true'
          # Any unknown role should fall through to `exec $@`, so a
          # harmless command works:
          docker run --rm social-api:test echo "fallthrough ok"

      - name: Verify image — non-root user
        run: |
          USER_ID=$(docker run --rm social-api:test id -u)
          echo "Container runs as uid: $USER_ID"
          # Root (0) is a hard fail. Any non-zero uid is acceptable;
          # specific uid (1000 or 10001) is asserted elsewhere by the
          # Dockerfile review, not CI — this catches "someone forgot
          # to add USER to Dockerfile".
          if [ "$USER_ID" = "0" ]; then
            echo "::error::container runs as root — add USER directive to Dockerfile"
            exit 1
          fi

      - name: Verify image — /health/ready responds (runtime smoke)
        run: |
          docker run -d --name social-api-smoke \
            -e ENCRYPTION_KEY="AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=" \
            -e JWT_PRIVATE_KEY_PATH=/app/secrets/jwt_private.pem \
            -e JWT_PUBLIC_KEY_PATH=/app/secrets/jwt_public.pem \
            -e SECRETS_BACKEND=skip \
            -e DATABASE_URL=mysql+asyncmy://x:x@127.0.0.1:3306/x \
            -e REDIS_URL=redis://127.0.0.1:6379/0 \
            -e APP_ENV=development \
            -p 8000:8000 \
            social-api:test api || true

          # api will fail to bind DB and stay unhealthy — that's OK,
          # we're proving the process *starts*, not that it serves.
          # Give it 5s, then check the process is alive and log for
          # the "starting gunicorn" line.
          sleep 5
          docker logs social-api-smoke 2>&1 | tee /tmp/api.log
          docker stop social-api-smoke || true
          docker rm social-api-smoke || true

          # The process should have reached "starting gunicorn" before
          # dying on DB connect. This catches a Dockerfile that forgot
          # to copy social_api/, entrypoint.sh, or uvicorn deps.
          if ! grep -q "starting gunicorn" /tmp/api.log; then
            echo "::error::api failed before logging 'starting gunicorn' — check entrypoint + CMD"
            exit 1
          fi
